schema_version: 1
providers:
  - id: cloud
    name: My verified cloud endpoint
    type: openai_compatible
    enabled: false
    priority: 10
    base_url: https://api.example.invalid/v1
    credentials:
      - id: primary
        api_key_env: SUPERVISOR_API_KEY
    models_endpoint: /models
    chat_endpoint: /chat/completions
    # No vendor/model-name blacklist. Configure the actual endpoint scope.
    policy:
      nsfw_policy: unknown
      allowed_content: [sfw]
      evidence: null
      review_due: null
      allow_unknown_input: false
    rpm: 10
    timeout_seconds: 90
    retries: 1
    models:
      - id: REPLACE_WITH_VERIFIED_MODEL
        text: true
        vision: true
        json_schema: true
        max_output_tokens: 1800
        max_long_edge: 1536
        pricing:
          currency: USD
          # Integer micro-currency per million tokens. Replace with real rates.
          input_per_million_micro: 1000000
          output_per_million_micro: 4000000
          image_input_tokens_bound: 4096
          max_call_micro: 100000
          source: REPLACE_WITH_PRICING_SOURCE
          verified_at: REPLACE_WITH_VERIFICATION_DATE
routes:
  tagging: [cloud/REPLACE_WITH_VERIFIED_MODEL]
  prompt_generation: [cloud/REPLACE_WITH_VERIFIED_MODEL]
  review: [cloud/REPLACE_WITH_VERIFIED_MODEL]
  summary: [cloud/REPLACE_WITH_VERIFIED_MODEL]

